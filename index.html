<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Краденые Дары Смерти</title>
<style>
  :root { --ink: #3b2412; --paper: #f1e2bf; --edge: #c9a96b; --red: #7a1712; --gold: #b8892b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #1b130c radial-gradient(ellipse at center, #3a2a19 0%, #120c07 75%) fixed;
    color: var(--ink); font-family: Georgia, "Times New Roman", serif;
    display: flex; justify-content: center; padding: 16px;
  }
  .scroll {
    width: 100%; max-width: 560px; margin: auto; padding: 28px 22px 26px;
    background: var(--paper) radial-gradient(ellipse at 30% 20%, #f8ecd0 0%, var(--paper) 55%, #e2c992 100%);
    border: 2px solid var(--edge); border-radius: 6px;
    box-shadow: 0 0 0 6px #2a1d10, 0 18px 50px #000a, inset 0 0 60px #a7814466;
    text-align: center;
  }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: 1px; color: var(--red); }
  .sub { font-style: italic; font-size: 14px; opacity: .75; margin-bottom: 18px; }
  .hallows { width: 70px; height: 70px; margin: 6px auto 10px; display: block; }
  .steps { display: flex; justify-content: center; gap: 6px; margin: 4px 0 18px; flex-wrap: wrap; }
  .steps i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); opacity: .5; }
  .steps i.done { background: var(--gold); border-color: var(--gold); opacity: 1; }
  .steps i.now { background: var(--red); border-color: var(--red); opacity: 1; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; opacity: .7; margin-top: 6px; }
  .riddle {
    font-size: 19px; line-height: 1.5; white-space: pre-line; margin: 10px 0 20px; padding: 14px 12px;
    border-top: 1px dashed var(--edge); border-bottom: 1px dashed var(--edge);
  }
  input {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; text-align: center;
    background: #fff8e6; color: var(--ink); border: 2px solid var(--edge); border-radius: 4px; outline: none;
  }
  input:focus { border-color: var(--red); }
  button {
    font: inherit; font-size: 18px; margin-top: 12px; padding: 11px 26px; cursor: pointer;
    background: var(--red); color: #f8ecd0; border: 0; border-radius: 4px; box-shadow: 0 3px 0 #3d0b08;
  }
  button.ghost { background: none; color: var(--ink); box-shadow: none; font-size: 15px; text-decoration: underline; opacity: .7; }
  .msg { min-height: 24px; margin-top: 12px; font-style: italic; color: var(--red); }
  .hint { margin: 10px 0 16px; font-size: 16px; font-style: italic; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .fade { animation: fade .9s ease; }
  @keyframes fade { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: none; } }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="scroll" id="card">
  <svg class="hallows" viewBox="0 0 100 100" fill="none" stroke="#3b2412" stroke-width="3">
    <path d="M50 8 L94 88 L6 88 Z"/><circle cx="50" cy="61" r="26"/><path d="M50 8 L50 88"/>
  </svg>
  <h1>Краденые Дары Смерти</h1>
  <div class="sub" id="sub"></div>
  <div class="steps" id="steps"></div>
  <div id="screen"></div>
</div>

<script>
// ===== Quest setup: edit only this block =====
// Each step: the answer to the task sheet the player holds now (several spellings allowed),
// then the riddle of the place where the next sheet is hidden.
// START is the riddle for the first sheet; the last step's place is where the gift is.
const OATH = ["торжественно клянусь что замышляю только шалость", "клянусь что замышляю только шалость"];
// Hiding places: 1 pillow, 2 sock drawer, 3 fridge, 4 bathroom mirror, 5 pot, 6 bookshelf, 7 flower pot,
// 8 washing machine, 9 door mat, 10 hallway closet, gift: suitcase.
const START = "Дары Смерти украдены! Первый след ведёт туда,\nгде каждую ночь ты отправляешься в страну снов.\nЗагляни под то, на чём лежит твоя голова.";
const STEPS = [
  { answer: ["ответ1"], place: "Добби стал свободным, когда получил меня в подарок.\nИщи там, где живут мои братья — по двое, парами.", hint: "Ящик с носками" },
  { answer: ["ответ2"], place: "Здесь вечная зима, как в Азкабане,\nно вместо дементоров — молоко и сыр.\nИщи на дверце.", hint: "Холодильник" },
  { answer: ["ответ3"], place: "Зеркало Еиналеж показывает самое заветное желание.\nА это зеркало каждое утро видит, как ты чистишь зубы.", hint: "Зеркало в ванной" },
  { answer: ["ответ4"], place: "Снейп варил бы в нём зелья,\nа дома в нём варят суп.", hint: "Кастрюля на кухне" },
  { answer: ["ответ5"], place: "Среди многих историй спряталась одна —\nпро мальчика со шрамом в виде молнии.", hint: "Книжная полка, книга про Гарри Поттера" },
  { answer: ["ответ6"], place: "Профессор Стебль поливала бы меня на уроке травологии.\nЗагляни под мой горшок.", hint: "Цветок в горшке" },
  { answer: ["ответ7"], place: "За круглым окном крутится вихрь,\nкак в каминной сети, только вместо пепла — пена.", hint: "Стиральная машина" },
  { answer: ["ответ8"], place: "Каждый, кто входит в этот замок,\nвытирает об меня ноги.", hint: "Коврик у входной двери" },
  { answer: ["ответ9"], place: "Десять лет Гарри жил в чулане под лестницей.\nНайди в доме свой чулан.", hint: "Шкаф или кладовка в прихожей" },
  { answer: ["ответ10"], place: "Дары Смерти сложены туда,\nс чем каждый первокурсник едет в Хогвартс с вокзала Кингс-Кросс.", hint: "Чемодан" },
];
// =============================================

const WRONG = [
  "Карта молчит. Попробуй ещё раз.",
  "Это заклинание не сработало.",
  "Филч уже идёт по коридору... подумай ещё.",
  "Даже Невилл знает, что это не так.",
  "Минус десять очков Гриффиндору!",
];
const KEY = "hp-quest-v1";
const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]/g, "");
const $ = id => document.getElementById(id);

let st = { step: -1, wrong: 0 };  // -1 = oath screen, 0..9 = answering task step+1, 10 = finished
try { st = JSON.parse(localStorage.getItem(KEY)) || st; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
if (location.hash === "#reset") { st = { step: -1, wrong: 0 }; save(); history.replaceState(null, "", location.pathname); }

function dots() {
  $("steps").innerHTML = STEPS.map((_, i) =>
    `<i class="${i < st.step ? "done" : i === st.step ? "now" : ""}"></i>`).join("");
}

function render() {
  dots();
  const s = $("screen");
  if (st.step < 0) {
    $("sub").textContent = "Карта откроется лишь тому, кто знает клятву";
    s.innerHTML = `<div class="riddle">Произнеси слова, которые открывают Карту Мародёров.</div>
      <input id="in" autocomplete="off" placeholder="Клятва..."><br><button id="go">Открыть карту</button>
      <div class="msg" id="msg"></div>`;
  } else if (st.step >= STEPS.length) {
    $("sub").textContent = "Шалость удалась!";
    s.innerHTML = `<div class="label">Последняя тайна</div>
      <div class="riddle fade">${esc(STEPS[STEPS.length - 1].place)}</div>
      <div>Все десять заданий пройдены. Дары Смерти найдены!</div>
      <button class="ghost" id="hintbtn">Подсказка</button><div class="hint hidden" id="hint">${esc(STEPS[STEPS.length - 1].hint)}</div>`;
    $("hintbtn").onclick = () => $("hint").classList.remove("hidden");
    return;
  } else {
    const place = st.step === 0 ? START : STEPS[st.step - 1].place;
    const hint = st.step === 0 ? "" : STEPS[st.step - 1].hint;
    $("sub").textContent = `Задание ${st.step + 1} из ${STEPS.length}`;
    s.innerHTML = `<div class="label">Где искать задание ${st.step + 1}</div>
      <div class="riddle fade">${esc(place)}</div>
      ${hint ? `<button class="ghost" id="hintbtn">Не могу найти</button><div class="hint hidden" id="hint">${esc(hint)}</div>` : ""}
      <div class="label">Ответ на задание ${st.step + 1}</div>
      <input id="in" autocomplete="off" placeholder="Ответ..."><br><button id="go">Проверить</button>
      <div class="msg" id="msg"></div>`;
    if (hint) $("hintbtn").onclick = () => $("hint").classList.remove("hidden");
  }
  $("go").onclick = check;
  $("in").onkeydown = e => { if (e.key === "Enter") check(); };
}

function check() {
  const v = norm($("in").value);
  if (!v) return;
  const ok = st.step < 0 ? OATH.map(norm).includes(v) : STEPS[st.step].answer.map(norm).includes(v);
  if (ok) {
    st = { step: st.step + 1, wrong: 0 };
    save(); render();
    return;
  }
  st.wrong++; save();
  $("msg").textContent = st.step < 0 ? "Карта осталась пустым пергаментом." : WRONG[(st.wrong - 1) % WRONG.length];
  const c = $("card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  $("in").select();
}

function esc(t) { return t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

render();
</script>
</body>
</html>
