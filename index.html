<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Краденые Дары Смерти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Cormorant+SC:wght@700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3a2210; --paper: #efdcb2; --paper2: #e3c58c; --edge: #a8783a;
    --red: #7d1a12; --gold: #d4a437; --glow: #ffd36e;
    --serif: "Cormorant Garamond", Georgia, serif; --title: "Cormorant SC", Georgia, serif; --hand: "Marck Script", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #26304f 0%, #121628 45%, #07080f 100%) fixed #07080f;
    color: var(--ink); font-family: var(--serif); overflow-x: hidden;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 64px 16px 32px;
  }
  #sky, #fx { position: fixed; inset: 0; pointer-events: none; }
  #sky { z-index: 0; }
  #fx { z-index: 30; }

  /* floating candles */
  .candle { position: fixed; z-index: 1; width: 10px; height: 46px; border-radius: 3px;
    background: linear-gradient(90deg, #d8cfb8, #fffaf0 45%, #cfc4a8); animation: float 6s ease-in-out infinite; opacity: .85; }
  .candle::before { content: ""; position: absolute; left: 50%; top: -15px; width: 9px; height: 15px; margin-left: -4.5px;
    background: radial-gradient(ellipse at 50% 70%, #fff 0%, #ffe28a 35%, #ff9a2e 70%, transparent 72%);
    border-radius: 50% 50% 45% 45%; box-shadow: 0 0 18px 6px #ffb84d66; animation: flicker .18s infinite alternate; }
  @keyframes float { 50% { transform: translateY(-14px); } }
  @keyframes flicker { to { transform: scale(.92, 1.06) translateY(-1px); opacity: .9; } }

  .map {
    position: relative; z-index: 5; width: 100%; max-width: 540px; padding: 30px 22px 26px; text-align: center;
    background:
      radial-gradient(ellipse at 20% 15%, #fbefd2 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, #d2ab6a 0%, transparent 50%),
      linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
    border-radius: 4px;
    box-shadow: 0 0 0 1px #5c3a16, 0 25px 70px #000c, 0 0 90px #ffcf6a22, inset 0 0 70px #8b5a2299, inset 0 0 14px #6b3f1288;
  }
  .map::before { /* fold lines of the map */
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 4px;
    background: linear-gradient(90deg, transparent 33%, #7a4f1f18 33.3%, transparent 33.6%, transparent 66.4%, #7a4f1f18 66.7%, transparent 67%),
                linear-gradient(0deg, transparent 49.7%, #7a4f1f18 50%, transparent 50.3%);
  }
  .turn { animation: turn .7s ease-in-out; }
  @keyframes turn { 50% { transform: perspective(900px) rotateY(80deg); filter: brightness(.6); } }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-9px) rotate(-.6deg); } 40%, 80% { transform: translateX(9px) rotate(.6deg); } }

  .head { font-family: var(--title); font-size: 13px; letter-spacing: 3px; color: #6b4a22; }
  h1 { font-family: var(--title); font-size: 34px; line-height: 1.05; margin: 6px 0 2px; color: var(--red);
       text-shadow: 0 1px 0 #fff6, 0 0 1px #7d1a12; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
       touch-action: none; }  /* a finger held on a phone became a scroll (pointercancel) and the reset hold never fired */
  .sub { font-style: italic; font-size: 17px; color: #5d3b18; margin-bottom: 12px; min-height: 22px; }
  .hallows { width: 64px; height: 64px; display: block; margin: 0 auto; filter: drop-shadow(0 0 6px #ffd36e66); }

  .progress { display: flex; justify-content: center; gap: 5px; margin: 6px 0 16px; flex-wrap: wrap; }
  .progress svg { width: 24px; height: 24px; opacity: .3; transition: all .5s; }
  .progress svg.done { opacity: 1; filter: drop-shadow(0 0 4px var(--glow)); }
  .progress svg.done path, .progress svg.done circle { stroke: #a5761c; }
  .progress svg.now { opacity: 1; animation: pulse 1.6s infinite; }
  .progress svg.now path, .progress svg.now circle { stroke: var(--red); }
  @keyframes pulse { 50% { transform: scale(1.18); } }

  .label { font-family: var(--title); font-size: 13px; letter-spacing: 2.5px; color: #6b4a22; margin-top: 8px; }
  .riddle { font-family: var(--hand); font-size: 25px; line-height: 1.35; color: #2b1606; white-space: pre-line;
            margin: 8px 0 6px; padding: 14px 6px; min-height: 90px; position: relative; }
  .riddle span { opacity: 0; animation: ink .5s forwards; }
  .comicbox { position: relative; margin-top: 10px; border-radius: 4px; border: 3px solid var(--edge); box-shadow: 0 3px 12px #3a221066; overflow: hidden; }
  .comic { display: block; width: 100%; animation: kb 14s ease-in-out infinite alternate; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
  .comicbox { max-width: calc(34vh * 4 / 3); margin-left: auto; margin-right: auto; }  /* 4:3 pictures, at most a third of the screen */
  /* a prologue page fits one phone screen: picture, text and the button without scrolling (Alex 97020) */
  body.story { padding-top: 66px; padding-bottom: 8px; }
  body.story .map { padding: 10px 14px 14px; }
  body.story .head, body.story .map > .hallows, body.story .progress { display: none; }
  body.story h1 { font-size: 24px; margin-top: 0; }
  body.story .sub { font-size: 15px; margin-bottom: 0; }
  body.story .riddle { font-size: clamp(17px, 2.9vh, 23px); line-height: 1.25; padding: 4px 2px; margin: 6px 0 2px; min-height: 0; }
  body.story .tools { margin-bottom: 0; }
  body.story .go { margin-top: 6px; }
  .panelfx { position: absolute; inset: 0; pointer-events: none; }
  .panelfx i { position: absolute; border-radius: 50%; }
  @keyframes ink { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
  .tools { display: flex; justify-content: center; gap: 18px; margin-bottom: 12px; }
  .link { font: italic 17px var(--serif); color: #5d3b18; background: none; border: 0; padding: 4px; cursor: pointer;
          text-decoration: underline dotted; text-underline-offset: 4px; }
  .hint { font-family: var(--hand); font-size: 22px; color: var(--red); margin: -4px 0 12px; animation: ink .6s; }

  input {
    width: 100%; font: 500 21px var(--serif); padding: 12px 14px; text-align: center; color: var(--ink);
    background: #fff5dc99; border: 0; border-bottom: 2px solid var(--edge); border-radius: 4px 4px 0 0; outline: none;
  }
  input:focus { background: #fff8e6; border-bottom-color: var(--red); }
  input::placeholder { color: #8a6a44; font-style: italic; }
  input + br + input { margin-top: 8px; }
  input.right { background: #e3f1d499; border-bottom-color: #3d7a2a; }
  .go {
    font: 700 19px var(--title); letter-spacing: 1.5px; margin-top: 14px; padding: 12px 30px; cursor: pointer;
    color: #fbe9c2; border: 0; border-radius: 30px;
    background: radial-gradient(circle at 35% 30%, #b0301f, #6a120c 70%);
    box-shadow: 0 4px 0 #3a0905, 0 6px 16px #0007, inset 0 1px 0 #ffffff40;
  }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a0905; }
  .msg { min-height: 26px; margin-top: 12px; font-style: italic; font-size: 17px; color: var(--red); }

  .feet { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 4px; }
  .foot { position: absolute; width: 9px; height: 15px; opacity: 0; animation: step 8s infinite; }
  @keyframes step { 0% { opacity: 0; } 8% { opacity: .35; } 40% { opacity: .2; } 60%, 100% { opacity: 0; } }

  #music { position: fixed; z-index: 40; top: 14px; right: 14px; width: 46px; height: 46px; border-radius: 50%;
           border: 1px solid #d4a43766; background: #0b0e1acc; color: var(--gold); font-size: 22px; cursor: pointer;
           box-shadow: 0 0 14px #d4a43733; }
  #music.off { opacity: .45; }

  #splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: radial-gradient(ellipse at center, #1a2038f2, #05060cfa); color: #e9d39b; cursor: pointer; text-align: center; padding: 20px; }
  #splash .hallows { width: 120px; height: 120px; animation: pulse 2.2s infinite; filter: drop-shadow(0 0 18px #ffd36e); }
  #splash .hallows path, #splash .hallows circle { stroke: var(--gold); }
  #splash h2 { font: 700 30px var(--title); margin: 0; color: var(--gold); }
  #splash p { font: italic 19px var(--serif); margin: 0; opacity: .8; }

  .snitch { position: fixed; z-index: 35; width: 70px; height: 30px; pointer-events: none; animation: fly 7s ease-in-out infinite; }
  .snitch b { position: absolute; left: 25px; top: 5px; width: 20px; height: 20px; border-radius: 50%;
              background: radial-gradient(circle at 35% 30%, #fff6c9, #e8b830 45%, #8a5e0a); box-shadow: 0 0 16px #ffd36e; }
  .snitch i { position: absolute; top: 2px; width: 26px; height: 12px; border-radius: 100% 0; background: linear-gradient(#fffef4ee, #d9d2bccc);
              animation: flap .09s infinite alternate; }
  .snitch i:first-child { left: 0; transform-origin: right center; }
  .snitch i:last-child { right: 0; transform-origin: left center; border-radius: 0 100%; }
  @keyframes flap { to { transform: scaleY(.25); } }
  @keyframes fly {
    0% { left: -80px; top: 30%; } 25% { left: 60%; top: 12%; } 50% { left: 20%; top: 60%; }
    75% { left: 80%; top: 45%; } 100% { left: 110%; top: 25%; }
  }
  @media (prefers-reduced-motion: reduce) { .riddle span { animation-duration: .01s; animation-delay: 0s !important; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>
<button id="music" title="Музыка">♪</button>

<div id="splash">
  <svg class="hallows" viewBox="0 0 100 100" fill="none" stroke-width="3"><path d="M50 8 L94 88 L6 88 Z"/><circle cx="50" cy="61" r="26"/><path d="M50 8 L50 88"/></svg>
  <h2>Краденые Дары Смерти</h2>
  <p>Коснись экрана волшебной палочкой</p>
</div>

<div class="map" id="card">
  <div class="feet" id="feet"></div>
  <div class="head">Карта Мародёров</div>
  <svg class="hallows" viewBox="0 0 100 100" fill="none" stroke="#3a2210" stroke-width="3">
    <path d="M50 8 L94 88 L6 88 Z"/><circle cx="50" cy="61" r="26"/><path d="M50 8 L50 88"/>
  </svg>
  <h1>Краденые Дары Смерти</h1>
  <div class="sub" id="sub"></div>
  <div class="progress" id="progress"></div>
  <div id="screen"></div>
</div>

<script src="quest.js"></script>
<script>
const Q = window.QUEST, STEPS = Q.steps;
const KEY = "hp-quest-v1", MUSIC_KEY = "hp-quest-music";
const WRONG = [
  "Карта молчит. Попробуй ещё раз.",
  "Это заклинание не сработало.",
  "Филч уже идёт по коридору... подумай ещё.",
  "Минус десять очков Гриффиндору!",
  "Даже Пивз знает, что это не так.",
];
const WRONG_OATH = [
  "Мистер Лунатик выражает своё почтение и просит не совать нос в чужие дела.",
  "Мистер Сохатый согласен с мистером Лунатиком.",
  "Мистер Бродяга удивлён, что такой человек вообще взял карту в руки.",
];
const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]/g, "");
const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

let st = { step: -1, wrong: 0 };  // -1 = oath screen, 0..9 = answering task step+1, 10 = finished
try { st = JSON.parse(load(KEY)) || st; } catch (e) {}
if (location.hash === "#reset") { st = { step: -1, wrong: 0 }; history.replaceState(null, "", location.pathname); }
const save = () => store(KEY, JSON.stringify(st));
save();

// ---------- sound: an original music-box waltz, effects and the narrator, all in the browser ----------
let ac, master, musicGain, sfxGain, musicOn = load(MUSIC_KEY) !== "off", seqTimer, nextT = 0, evIdx = 0, loopStart = 0;
const BEAT = 0.42, NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const midi = n => 12 * (+n.slice(-1) + 1) + NOTE[n[0]] + (n[1] === "#" ? 1 : 0);
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const MELODY = [
  [["G4", 1], ["B4", 1], ["E5", 1]], [["D5", 1.5], ["C5", .5], ["B4", 1]], [["A4", 1], ["C5", 1], ["E5", 1]], [["F#5", 2], ["D#5", 1]],
  [["E5", 1], ["G5", 1], ["B5", 1]], [["A5", 1.5], ["G5", .5], ["F#5", 1]], [["G5", 1], ["E5", 1], ["C5", 1]], [["B4", 3]],
  [["C5", 1], ["E5", 1], ["A5", 1]], [["G5", 1.5], ["F#5", .5], ["E5", 1]], [["D#5", 1], ["F#5", 1], ["B5", 1]], [["A5", 2], ["F#5", 1]],
  [["G5", 1], ["E5", 1], ["B4", 1]], [["C5", 1], ["A4", 1], ["F#4", 1]], [["B4", 1.5], ["D#5", .5], ["F#5", 1]], [["E5", 3]],
];
const CHORDS = { Em: ["E3", "G4", "B4"], G: ["G3", "B4", "D5"], Am: ["A3", "C5", "E5"], B7: ["B2", "D#4", "A4"], D: ["D3", "F#4", "A4"], C: ["C3", "E4", "G4"] };
const BARS = ["Em", "G", "Am", "B7", "Em", "D", "C", "B7", "Am", "Em", "B7", "D", "Em", "Am", "B7", "Em"];
const EVENTS = [];  // [beat, midi, dur, vol]
MELODY.forEach((bar, b) => {
  let t = b * 3;
  bar.forEach(([n, d]) => { EVENTS.push([t, midi(n), d, .22]); t += d; });
  const [bass, c1, c2] = CHORDS[BARS[b]];
  EVENTS.push([b * 3, midi(bass), 3, .16]);
  for (const k of [1, 2]) { EVENTS.push([b * 3 + k, midi(c1), 1, .06]); EVENTS.push([b * 3 + k, midi(c2), 1, .06]); }
});
EVENTS.sort((a, b) => a[0] - b[0]);
const LOOP = 48;

function audioInit() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
  const verb = ac.createConvolver(), len = ac.sampleRate * 2.6, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  verb.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = .45; verb.connect(wet); wet.connect(master);
  musicGain = ac.createGain(); musicGain.gain.value = musicOn ? .5 : 0;
  musicGain.connect(master); musicGain.connect(verb);
  sfxGain = ac.createGain(); sfxGain.gain.value = .7; sfxGain.connect(master); sfxGain.connect(verb);
}

function bell(m, t, dur, vol, out) {  // music-box tine: fundamental + a soft high partial, fast decay
  for (const [mult, v] of [[1, 1], [4.01, .18], [2, .25]]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = mult === 2 ? "triangle" : "sine"; o.frequency.value = hz(m) * mult;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + .005);
    g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.6, dur * BEAT * 1.6) / (mult > 2 ? 3 : 1));
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur * BEAT * 1.8 + .1);
  }
}

function schedule() {
  while (nextT < ac.currentTime + .4) {
    const [b, m, d, v] = EVENTS[evIdx];
    bell(m, loopStart + b * BEAT, d, v, musicGain);
    evIdx++;
    if (evIdx >= EVENTS.length) { evIdx = 0; loopStart += LOOP * BEAT; }
    nextT = loopStart + EVENTS[evIdx][0] * BEAT;
  }
}

function musicStart() {
  audioInit(); ac.resume();
  if (!seqTimer) { loopStart = ac.currentTime + .2; evIdx = 0; nextT = loopStart; seqTimer = setInterval(schedule, 100); schedule(); }
}

function setMusic(on) {
  musicOn = on; store(MUSIC_KEY, on ? "on" : "off");
  $("music").classList.toggle("off", !on);
  if (ac) musicGain.gain.setTargetAtTime(on ? (speaking ? .15 : .5) : 0, ac.currentTime, .3);
}

function sfx(kind) {
  if (!ac) return;
  const t = ac.currentTime;
  if (kind === "ok") ["E5", "G5", "B5", "E6", "G6", "B6"].forEach((n, i) => bell(midi(n), t + i * .07, 2, .2, sfxGain));
  if (kind === "bad") {
    for (const m of [midi("C3"), midi("F#3")]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = hz(m);
      g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .5);
      o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + .55);
    }
  }
  if (kind === "whoosh") {
    const n = ac.createBufferSource(), buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = buf;
    const f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = "bandpass"; f.Q.value = 2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3000, t + .6);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .2); g.gain.exponentialRampToValueAtTime(.001, t + .8);
    n.connect(f); f.connect(g); g.connect(sfxGain); n.start(t); n.stop(t + .9);
  }
}

// narrator: audio/<name>.mp3 from gen_audio.py; the browser's own voice if the file is missing
let voice = null, speaking = false;
function say(name, text) {
  stopVoice();
  const duck = on => { speaking = on; if (ac && musicOn) musicGain.gain.setTargetAtTime(on ? .15 : .5, ac.currentTime, .25); };
  voice = new Audio(`audio/${name}.mp3`);
  voice.onplay = () => duck(true);
  voice.onended = voice.onpause = () => duck(false);
  voice.onerror = () => {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g, " "));
    u.lang = "ru-RU"; u.rate = .9; u.pitch = .85;
    u.onstart = () => duck(true); u.onend = () => duck(false);
    speechSynthesis.speak(u);
  };
  voice.play().catch(() => {});
}
function stopVoice() {
  if (voice) { voice.onerror = null; voice.pause(); voice = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
}

// ---------- visuals ----------
function sky() {
  const c = $("sky"), x = c.getContext("2d");
  const stars = Array.from({ length: 120 }, () => [Math.random(), Math.random(), Math.random() * 1.3 + .3, Math.random() * 6]);
  const size = () => { c.width = innerWidth; c.height = innerHeight; };
  size(); addEventListener("resize", size);
  (function draw(ms) {
    x.clearRect(0, 0, c.width, c.height);
    for (const [sx, sy, r, ph] of stars) {
      x.globalAlpha = .35 + .35 * Math.sin(ms / 900 + ph);
      x.fillStyle = "#fff6d8"; x.beginPath(); x.arc(sx * c.width, sy * c.height, r, 0, 7); x.fill();
    }
    requestAnimationFrame(draw);
  })(0);
  for (let i = 0; i < 7; i++) {
    const d = document.createElement("div");
    d.className = "candle";
    d.style.left = (4 + Math.random() * 92) + "vw"; d.style.top = (6 + Math.random() * 80) + "vh";
    d.style.animationDelay = (-Math.random() * 6) + "s"; d.style.transform = `scale(${.6 + Math.random() * .6})`;
    document.body.appendChild(d);
  }
  const feet = $("feet");
  for (let i = 0; i < 12; i++) {  // a trail of footprints walking across the map
    const f = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    f.setAttribute("viewBox", "0 0 10 16"); f.setAttribute("class", "foot");
    f.innerHTML = '<ellipse cx="5" cy="5" rx="4" ry="5" fill="#3a2210"/><ellipse cx="5" cy="13" rx="3" ry="2.6" fill="#3a2210"/>';
    f.style.left = (8 + i * 7.5) + "%"; f.style.top = (78 - Math.sin(i / 2) * 6 + (i % 2 ? 2.5 : 0)) + "%";
    f.style.transform = `rotate(${80 + Math.cos(i / 2) * 15}deg)`; f.style.animationDelay = (i * .35) + "s";
    feet.appendChild(f);
  }
}

const parts = [];
function burst(x, y, n = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, r: 1 + Math.random() * 2.5 });
  }
}
(function fx() {
  const c = $("fx"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  addEventListener("resize", () => { c.width = innerWidth; c.height = innerHeight; });
  (function draw() {
    x.clearRect(0, 0, c.width, c.height);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .08; p.vx *= .98; p.life -= .012;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      x.globalAlpha = p.life; x.fillStyle = Math.random() < .3 ? "#fff" : "#ffd36e";
      x.shadowColor = "#ffcf5a"; x.shadowBlur = 8;
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
    }
    requestAnimationFrame(draw);
  })();
})();

const HALLOW = '<svg viewBox="0 0 100 100" fill="none" stroke="#3a2210" stroke-width="7"><path d="M50 8 L94 88 L6 88 Z"/><circle cx="50" cy="61" r="26"/><path d="M50 8 L50 88"/></svg>';
const inked = t => [...t].map((ch, i) => ch === "\n" ? "\n" : `<span style="animation-delay:${i * 28}ms">${esc(ch)}</span>`).join("");

// ---------- the quest ----------
const PRO = Q.prologue || [], inPrologue = () => st.step < 0 && (st.pro || 0) < PRO.length;
function current() {  // [audio name, riddle, hint] of what is on screen now
  if (inPrologue()) return [`pro${(st.pro || 0) + 1}`, PRO[st.pro || 0].text, ""];
  if (st.step < 0) return ["intro", Q.intro, ""];
  if (st.step === 0) return ["start", Q.start, ""];
  return [`place${st.step}`, STEPS[st.step - 1].place, STEPS[st.step - 1].hint];
}

// comic pictures come alive like the Dobby story: a slow zoom plus glows, candle flames, sparkles, fireworks, snow
// and fog at the spots listed in quest.js ("fx", x/y/spread in % of the picture)
const FX = Object.fromEntries([...PRO.map(p => [p.img, p.fx]), [Q.final_img, Q.final_fx]]);
const comic = src => `<div class="comicbox"><img class="comic" src="${src}" alt=""><div class="panelfx" data-src="${src}"></div></div>`;
let fxParts = [];
function startFx() {
  fxParts = [];
  const box = document.querySelector(".panelfx"); if (!box) return;
  const rnd = (c, s) => c + (Math.random() - .5) * 2 * (s || 0);
  const dot = (x, y, sz, color, extra = {}) => {
    const el = document.createElement("i");
    Object.assign(el.style, { left: x + "%", top: y + "%", width: sz + "px", height: sz + "px", background: color,
                              boxShadow: `0 0 ${sz * 3}px ${sz * .8}px ${color}`, ...extra });
    box.appendChild(el); return el;
  };
  for (const h of FX[box.dataset.src] || []) {
    const n = h.count || 1, ph = () => Math.random() * 6.28;
    if (h.type === "glow") {
      const el = dot(h.x - h.w / 2, h.y - h.h / 2, 0, "transparent", { width: h.w + "%", height: h.h + "%", boxShadow: "none",
        background: `radial-gradient(ellipse, ${h.color} 5%, ${h.color}80 30%, transparent 70%)`, opacity: h.opacity || .45, mixBlendMode: "screen" });
      fxParts.push({ el, type: "glow", op: h.opacity || .45, ph: ph() });
    }
    if (h.type === "fog") {
      const el = dot(h.x - h.w / 2, h.y - h.h / 2, 0, "transparent", { width: h.w + "%", height: h.h + "%", boxShadow: "none",
        background: `radial-gradient(ellipse, ${h.color} 10%, ${h.color}80 40%, transparent 70%)`, opacity: .5 });
      fxParts.push({ el, type: "fog", x: h.x - h.w / 2, ph: ph() });
    }
    for (let i = 0; i < n && ["flame", "sparkle", "snow", "firework"].includes(h.type); i++) {
      const x = h.type === "snow" ? Math.random() * 100 : rnd(h.x, h.spread), y = h.type === "snow" ? Math.random() * 100 : rnd(h.y, h.spread);
      const sz = h.type === "flame" ? 3 + Math.random() * 3 : h.type === "snow" ? 2 + Math.random() * 3 : 3 + Math.random() * 4;
      const color = h.type === "snow" ? "#fff" : Array.isArray(h.color) ? h.color[i % h.color.length] : h.color;
      fxParts.push({ el: dot(x, y, sz, color, { opacity: 0 }), type: h.type, x, y, ox: x, oy: y, ph: ph(), sp: .6 + Math.random() * .8, h });
    }
  }
}
(function fxLoop(ms) {
  const t = ms / 1000;
  for (const p of fxParts) {
    const s = p.el.style;
    if (p.type === "glow") s.opacity = p.op * (.6 + .4 * Math.sin(t * 1.5 + p.ph));
    if (p.type === "fog") { s.left = p.x + 4 * Math.sin(t * .2 + p.ph) + "%"; s.opacity = .35 + .15 * Math.sin(t * .5 + p.ph); }
    if (p.type === "flame") { s.left = p.ox + .6 * Math.sin(t * 3 + p.ph) + "%"; s.top = p.oy - 1.5 * Math.abs(Math.sin(t * p.sp * 3 + p.ph)) + "%";
                              s.opacity = .55 + .45 * Math.sin(t * 4 * p.sp + p.ph); }
    if (p.type === "sparkle") { const v = Math.sin(t * p.sp * 1.5 + p.ph); s.opacity = Math.max(0, v * .9 + .1);
                                if (v < -.95) { s.left = (p.ox = Math.min(98, Math.max(2, p.x + (Math.random() - .5) * 8))) + "%"; } }
    if (p.type === "firework") {  // bursts: dots fly out from the centre and fade, then start again
      const k = ((t * .45 * p.sp + p.ph) % 1), a = p.ph * 7, r = k * (p.h.spread || 8);
      s.left = p.h.x + Math.cos(a) * r + "%"; s.top = p.h.y + Math.sin(a) * r * 1.33 + k * k * 3 + "%"; s.opacity = 1 - k;
    }
    if (p.type === "snow") { p.y += .04 * p.sp; if (p.y > 102) { p.y = -2; p.x = Math.random() * 100; }
                             s.left = p.x + .5 * Math.sin(t + p.ph) + "%"; s.top = p.y + "%"; s.opacity = .8; }
  }
  requestAnimationFrame(fxLoop);
})(0);

function render(speak) {
  $("progress").innerHTML = STEPS.map((_, i) => HALLOW.replace("<svg", `<svg class="${i < st.step ? "done" : i === st.step ? "now" : ""}"`)).join("");
  const s = $("screen"), [name, text, hint] = current();
  document.body.classList.toggle("story", inPrologue());
  if (inPrologue()) {  // the comic before the oath, one page per tap
    const k = st.pro || 0;
    $("sub").textContent = `Пролог · ${k + 1} из ${PRO.length}`;
    s.innerHTML = `${comic(PRO[k].img)}
      <div class="riddle">${inked(text)}</div>
      <div class="tools"><button class="link" id="again">🔊 Послушать</button></div>
      <button class="go" id="next">Дальше</button>`;
    $("next").onclick = () => { st.pro = k + 1; save(); sfx("whoosh"); render(true); scrollTo({ top: 0, behavior: "smooth" }); };
  } else if (st.step < 0) {
    $("sub").textContent = "Карта откроется лишь тому, кто знает клятву";
    s.innerHTML = `<div class="riddle">${inked(text)}</div>
      <div class="tools"><button class="link" id="again">🔊 Послушать</button></div>
      <input class="ans" autocomplete="off" autocapitalize="off" placeholder="Клятва..."><br>
      <button class="go" id="go">Открыть карту</button><div class="msg" id="msg"></div>`;
  } else if (st.step >= STEPS.length) {
    $("sub").textContent = "Шалость удалась!";
    s.innerHTML = `${Q.final_img ? comic(Q.final_img) : ""}<div class="riddle">${inked(Q.final)}</div>
      <div class="label">Где спрятаны Дары Смерти</div>
      <div class="riddle">${inked(text)}</div>
      <div class="tools"><button class="link" id="again">🔊 Послушать</button><button class="link" id="hintbtn">Не могу найти</button></div>
      <div id="hintbox"></div>`;
    if (!document.querySelector(".snitch")) document.body.insertAdjacentHTML("beforeend", '<div class="snitch"><i></i><b></b><i></i></div>');
    burst(innerWidth / 2, innerHeight / 3, 140);
  } else {
    $("sub").textContent = `Задание ${st.step + 1} из ${STEPS.length}`;
    const task = esc(STEPS[st.step].name), parts = STEPS[st.step].parts || [{ label: "Ответ" }];
    s.innerHTML = `<div class="label">Где искать задание «${task}»</div>
      <div class="riddle">${inked(text)}</div>
      <div class="tools"><button class="link" id="again">🔊 Послушать</button>${hint ? '<button class="link" id="hintbtn">Не могу найти</button>' : ""}</div>
      <div id="hintbox"></div>
      <div class="label">Ответ на задание «${task}»</div>
      ${parts.map(p => `<input class="ans" autocomplete="off" autocapitalize="off" placeholder="${esc(p.label)}...">`).join("<br>")}<br>
      <button class="go" id="go">Проверить</button><div class="msg" id="msg"></div>`;
  }
  startFx();
  $("again").onclick = () => say(name, st.step >= STEPS.length ? Q.final + " " + text : text);
  if ($("hintbtn")) $("hintbtn").onclick = () => { $("hintbox").innerHTML = `<div class="hint">${esc(hint)}</div>`; };
  if ($("go")) {
    $("go").onclick = check;
    for (const i of document.querySelectorAll(".ans")) i.onkeydown = e => { if (e.key === "Enter") check(); };
  }
  if (speak) {
    if (st.step >= STEPS.length) { say("final", Q.final); voice.onended = () => { speaking = false; say(name, text); }; }
    else say(name, text);
  }
}

function check() {
  const ins = [...document.querySelectorAll(".ans")], vs = ins.map(i => norm(i.value));
  if (!vs.some(Boolean)) return;
  const S = STEPS[st.step];
  // the next task's name always passes; a sheet with several answers ("parts") needs every field right
  let ok = st.step < 0 ? Q.oath.map(norm).includes(vs[0]) : vs.some(v => S.answer.map(norm).includes(v)), good = [];
  if (!ok && S && S.parts) {
    good = S.parts.map((p, i) => p.answer.map(norm).includes(vs[i]));
    ins.forEach((el, i) => el.classList.toggle("right", good[i]));
    ok = good.every(Boolean);
  }
  if (ok) {
    const r = $("go").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 80); sfx("ok");
    st = { step: st.step + 1, wrong: 0 }; save();
    setTimeout(() => sfx("whoosh"), 250);
    const c = $("card"); c.classList.remove("turn"); void c.offsetWidth; c.classList.add("turn");
    setTimeout(() => { render(true); scrollTo({ top: 0, behavior: "smooth" }); }, 350);
    return;
  }
  st.wrong++; save(); sfx("bad");
  const right = good.filter(Boolean).length;
  $("msg").textContent = st.step < 0 ? WRONG_OATH[(st.wrong - 1) % WRONG_OATH.length]
    : right ? `Верно ${right} из ${good.length}! Остальное ещё не то.` : WRONG[(st.wrong - 1) % WRONG.length];
  const c = $("card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  (ins.find(i => !i.classList.contains("right")) || ins[0]).select();
}

// parents: hold the title 2 s to start over (no visible button, so a child can't wipe the progress by accident)
const h1 = document.querySelector("h1");
let holdT;
h1.onpointerdown = () => { holdT = setTimeout(askReset, 2000); };
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) h1.addEventListener(ev, () => clearTimeout(holdT));
h1.oncontextmenu = e => e.preventDefault();
function askReset() {
  $("sub").innerHTML = 'Начать квест сначала? <button class="link" id="rsYes">Да</button> <button class="link" id="rsNo">Нет</button>';
  $("rsYes").onclick = () => { st = { step: -1, wrong: 0 }; save(); render(true); };
  $("rsNo").onclick = () => render(false);
}
// the #reset link opened in a tab that already has the quest changes only the hash, the page does not reload
addEventListener("hashchange", () => {
  if (location.hash !== "#reset") return;
  history.replaceState(null, "", location.pathname); st = { step: -1, wrong: 0 }; save(); render(true);
});

$("music").classList.toggle("off", !musicOn);
$("music").onclick = () => { musicStart(); setMusic(!musicOn); };
$("splash").onclick = () => {
  $("splash").remove();
  musicStart(); sfx("whoosh"); render(true);
};
sky();
render(false);
</script>
</body>
</html>
